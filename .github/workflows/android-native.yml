name: Android native skeleton
on:
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 platforms;android-36 build-tools;36.0.0 platform-tools'
      - name: Assemble debug and run unit tests
        working-directory: android-native
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace
